plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.ijazah'
version = '1.0.0'

android {
  namespace "com.ijazah.roomkeepalive"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  implementation "androidx.core:core-ktx:1.17.0"
  implementation 'com.facebook.react:react-android'
}
