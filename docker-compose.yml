# Local infrastructure only. The API and worker run from `pnpm dev` (quickstart §1).
# Ports are published on 127.0.0.1 only: Docker otherwise binds 0.0.0.0, and the official Redis image runs
# with protected mode off and no password, so a laptop on a shared network would expose an open Redis.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ijazah
      POSTGRES_USER: ijazah_owner
      POSTGRES_PASSWORD: owner
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ijazah_owner -d ijazah"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
