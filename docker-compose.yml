# Local infrastructure only. The API and worker run from `pnpm dev` (quickstart §1).
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ijazah
      POSTGRES_USER: ijazah_owner
      POSTGRES_PASSWORD: owner
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ijazah_owner -d ijazah"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
