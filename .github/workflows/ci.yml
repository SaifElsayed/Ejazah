# Pipeline stages ordered by how fast they fail (research R-13): typecheck and fast lint, then tests,
# then type-aware lint with the schema and snapshot checks, then the database probes, then the build.
name: ci

# The token gets read access only (GitHub Actions hardening guide, OpenSSF Scorecard Token-Permissions).
# A stage that must write, such as a deploy, raises it on its own job, never here.
permissions:
  contents: read

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  stage-1-typecheck-and-fast-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # pnpm's version comes from `packageManager` in package.json, Node's from .nvmrc.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # T091 — R-PROC-1: the branch is named for its specs/NNN-* folder and task ids and targets develop.
      - run: pnpm check:branch
      # T102 — the database client is generated, never committed; the typecheck reads its types.
      - run: pnpm db:generate
      # T081 — the typecheck and the fast lint run side by side (research R-13), each to its own log,
      # printed after both end, so a lint failure is reported even when the typecheck fails too.
      # T048 — `pnpm lint` is the fast, syntax-only rule set, the same one the pre-commit hook runs.
      - name: Typecheck and fast lint, in parallel (research R-13)
        run: |
          pnpm typecheck > "$RUNNER_TEMP/typecheck.log" 2>&1 &
          typecheck_pid=$!
          pnpm lint > "$RUNNER_TEMP/lint.log" 2>&1 &
          lint_pid=$!
          typecheck_status=0
          wait "$typecheck_pid" || typecheck_status=$?
          lint_status=0
          wait "$lint_pid" || lint_status=$?
          printf '== pnpm typecheck (exit %s)\n' "$typecheck_status"
          cat "$RUNNER_TEMP/typecheck.log"
          printf '\n== pnpm lint (exit %s)\n' "$lint_status"
          cat "$RUNNER_TEMP/lint.log"
          test "$typecheck_status" -eq 0 && test "$lint_status" -eq 0
      # T140 — the suppression rule run again over the files `pnpm lint` reads, with inline
      # configuration off, so no comment can switch it off (FR-008).
      - name: Suppression gate, inline configuration off (R-PROC-7)
        run: pnpm check:suppressions
      # T161 — R-MOBILE-7's CI tier: ar.json and en.json hold the same keys, nested ones included,
      # each key one file lacks named with that file (US1 scenario 5).
      - name: i18n key parity between ar.json and en.json (R-MOBILE-7)
        run: pnpm check:i18n
      # ADR 0020 D6 — the admin panel has its own pair (ADR 0014 D2), held to the same parity.
      - name: i18n key parity of the admin catalogue (ADR 0020)
        run: pnpm check:i18n:admin

  stage-2-unit-and-property-tests:
    runs-on: ubuntu-latest
    needs: stage-1-typecheck-and-fast-lint
    # T081 — the suite reads a migrated database, and its seed specs create databases of their own
    # (tests/seed), so it gets the PostgreSQL and Redis of docker-compose.yml, with the same roles.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: ijazah
          POSTGRES_USER: ijazah_owner
          POSTGRES_PASSWORD: owner
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ijazah_owner -d ijazah"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    # The development values of .env.example: throwaway credentials of a database that lives only
    # for this job, never a secret (R-SEC-1).
    env:
      DATABASE_URL_OWNER: postgresql://ijazah_owner:owner@localhost:5432/ijazah
      DATABASE_URL: postgresql://ijazah_app:app@localhost:5432/ijazah
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # T102 — `apps/api/src/platform/db/prisma.repository.spec.ts` fails by design on the empty stand-in.
      - run: pnpm db:generate
      # T065 — a service container starts before the checkout, so it cannot mount docker/initdb as
      # docker-compose.yml does; the same file is run here, through the image's own psql.
      - name: Create the application role, as docker/initdb does locally (T065)
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: >-
          docker exec --interactive "$POSTGRES_CONTAINER"
          psql --set ON_ERROR_STOP=1 --username ijazah_owner --dbname ijazah
          < docker/initdb/01-application-role.sql
      - run: pnpm db:migrate
      # T083 — the same pinned, checksum-verified binary as the secret-scan job: each job runs on its
      # own machine, and tests/pipeline/secret-scan.spec.ts (T080) fails by design without it.
      - name: Install Gitleaks 8.30.1
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar --extract --gzip --file "$RUNNER_TEMP/$archive" --directory "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
      # T086 — the whole suite with coverage, because a run over some specs only would fail the
      # floor of a path it never loaded. The integrity probes run once, in stage 4, as the
      # application role; leaving them out here changes no covered path.
      - name: Unit and property tests with the 80% coverage floor (R-PROC-5)
        run: pnpm test -- --coverage --exclude 'tests/db-integrity/**'
      # B6 — the phone's specs: Jest with jest-expo and React Native Testing Library, the toolchain
      # Expo documents (owner's decision, 2026-10-19); Vitest cannot load React Native.
      - name: Phone tests (Jest, apps/mobile)
        run: pnpm --filter @ijazah/mobile test

  stage-3-type-aware-lint-schema-snapshot:
    runs-on: ubuntu-latest
    needs: stage-2-unit-and-property-tests
    # The schema check reads the live catalogue of a migrated database (T070).
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: ijazah
          POSTGRES_USER: ijazah_owner
          POSTGRES_PASSWORD: owner
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ijazah_owner -d ijazah"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL_OWNER: postgresql://ijazah_owner:owner@localhost:5432/ijazah
      DATABASE_URL: postgresql://ijazah_app:app@localhost:5432/ijazah
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # T102 — the type-aware rules resolve the generated client's types (api/table-ownership,
      # gender/require-requester-gender); without it the client is an empty stand-in. The contract
      # snapshot reads the client's enums too (T084).
      - run: pnpm db:generate
      # T048 — the type-aware set (eslint.types.config.js), which only the pipeline runs (research R-10).
      - run: pnpm lint:types
      # T157 — every numeric literal other than 0 and 1 under apps/api/src/modules/, specs excluded,
      # read from the syntax tree so comments and strings are never read (FR-034). pnpm 9.12 passes the
      # script's exit code through unchanged (checked on Linux and Windows), so the step can tell a
      # refused literal (1) from a root that could not be read (2) and annotate each in its own words,
      # as the schema check below does.
      - name: Magic-number gate over the modules (R-MONEY-12)
        run: |
          status=0
          pnpm check:magic-numbers || status=$?
          case "$status" in
            0) ;;
            1) echo "::error::R-MONEY-12: numeric literals in module code (listed above); read each from settings (FR-034)"; exit 1 ;;
            *) echo "::error::R-MONEY-12: the magic-number gate could not read the modules (exit $status); no file was judged"; exit "$status" ;;
          esac
      # T084 — the checkout holds one commit, so the base the change is compared with is fetched:
      # a pull request's target branch, or for a push to develop or main the commit before the push.
      - name: Fetch the base the change is compared with
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ -n "$BASE_REF" ]; then
            git fetch --no-tags --depth=1 origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
            echo "COMPARE_BASE=origin/$BASE_REF" >> "$GITHUB_ENV"
          else
            git fetch --no-tags --depth=1 origin "$BEFORE_SHA"
            echo "COMPARE_BASE=$BEFORE_SHA" >> "$GITHUB_ENV"
          fi
      # T071 — a fresh database has applied nothing for Prisma's own checksum to compare with, so
      # every migration merged on the base must be unchanged in the head, and a new one sort last.
      - name: Migration checksum verification against the base (R-DB-1)
        run: pnpm check:migrations --base "$COMPARE_BASE"
      # T163 — a gender or time change must carry a change to its adversarial or DST tests; the
      # guarded paths and their tests are listed in scripts/suite-gate.paths.ts.
      - name: Suite gate against the base (R-PROC-5)
        run: pnpm check:suites --base "$COMPARE_BASE"
      - name: Create the application role, as docker/initdb does locally (T065)
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: >-
          docker exec --interactive "$POSTGRES_CONTAINER"
          psql --set ON_ERROR_STOP=1 --username ijazah_owner --dbname ijazah
          < docker/initdb/01-application-role.sql
      - run: pnpm db:migrate
      # T070 — called through tsx rather than `pnpm db:schema:check`, which folds exit 2 into 1, so
      # the log says whether the schema broke a convention or the check could not read it.
      - name: Schema check against the migrated catalogue (ERD §0)
        run: |
          status=0
          pnpm exec tsx scripts/schema-check.ts || status=$?
          case "$status" in
            0) ;;
            1) echo "::error::schema check: the migrated schema breaks the ERD §0 conventions listed above"; exit 1 ;;
            *) echo "::error::schema check: could not connect to or read the catalogue (exit $status); no schema was judged"; exit "$status" ;;
          esac
      - name: Contract snapshot diff against the base (R-API-9)
        run: pnpm contract:snapshot --check --base "$COMPARE_BASE"
      # T085 — after `pnpm db:generate`, since regenerating the snapshot reads the client's enums.
      - name: Generated-file drift check (R-PROC-9)
        run: pnpm check:generated
      # T028 — every user-surface procedure that is not public has tests naming its path and asserting
      # its kind's refusals, read from the committed contract snapshot once the drift check above has
      # proved it current (FR-210; review of B7, 12).
      - name: Authorization-test gate (R-MOBILE-13)
        run: pnpm check:authz

  stage-4-database-integrity-probes:
    runs-on: ubuntu-latest
    needs: stage-3-type-aware-lint-schema-snapshot
    # The probes connect as the application role and clean up as the owner, so both URLs are set
    # (notes under T142 and T065); they open no Redis connection.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: ijazah
          POSTGRES_USER: ijazah_owner
          POSTGRES_PASSWORD: owner
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ijazah_owner -d ijazah"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL_OWNER: postgresql://ijazah_owner:owner@localhost:5432/ijazah
      DATABASE_URL: postgresql://ijazah_app:app@localhost:5432/ijazah
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The probes load repository code that imports the generated client (T102).
      - run: pnpm db:generate
      - name: Create the application role, as docker/initdb does locally (T065)
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: >-
          docker exec --interactive "$POSTGRES_CONTAINER"
          psql --set ON_ERROR_STOP=1 --username ijazah_owner --dbname ijazah
          < docker/initdb/01-application-role.sql
      - run: pnpm db:migrate
      - name: Integrity probes as the application role against the migrated database
        run: pnpm test:db-integrity

  stage-5-build:
    runs-on: ubuntu-latest
    needs: stage-4-database-integrity-probes
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The API's build compiles against the generated client's types (T102).
      - run: pnpm db:generate
      - run: pnpm build

  secret-scan:
    # Independent of the pre-commit hook on purpose (SC-010). Scans full history including specs/.
    # T083 — the Gitleaks binary itself, pinned and checksum-verified, rather than gitleaks-action:
    # the action scans only a pull request's own commits, and this net must read the whole history.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Install Gitleaks 8.30.1
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar --extract --gzip --file "$RUNNER_TEMP/$archive" --directory "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
      # Every commit on every fetched branch and tag (Gitleaks reads `git log --all`), specs/ included.
      - run: gitleaks git --redact --verbose --no-banner

  adversarial-gender-suite:
    # Blocking from the first commit even while its case coverage is small (FR-064).
    # T087 — every case in both directions against the SRS §3.7.1 predicate (ADR 0006). It needs
    # no stage before it and no database yet; the predicate's implementation joins in Phase 2.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The cases read the genders and verification statuses from the generated client (T102).
      - run: pnpm db:generate
      - name: Adversarial gender suite, both directions (R-GENDER-1, R-GENDER-2, R-GENDER-3)
        run: pnpm test:adversarial

  dependency-alerts:
    # T090 — FR-060, R-SEC-12: no merge while a critical dependency alert is open. Two readings of
    # the same advisory data, each failing closed: the lockfile against the GitHub Advisory
    # Database, and the repository's own open Dependabot alerts.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      # T160 — both readings and T158's expiry warning live in scripts/dependency-alerts.ts, so its
      # spec proves every refusal (tests/pipeline/dependency-alerts.spec.ts). It runs under Node's own
      # type stripping, so nothing is installed before the lockfile is audited. GITHUB_TOKEN cannot
      # read Dependabot alerts, so a fine-grained token with "Dependabot alerts: read" on this
      # repository is stored as DEPENDABOT_ALERTS_TOKEN (the owner's, note under T090); the script
      # fails closed without it. GITHUB_REPOSITORY is set by the runner.
      - name: No critical advisory and no open critical Dependabot alert (R-SEC-12)
        env:
          DEPENDABOT_ALERTS_TOKEN: ${{ secrets.DEPENDABOT_ALERTS_TOKEN }}
        run: node scripts/dependency-alerts.ts
