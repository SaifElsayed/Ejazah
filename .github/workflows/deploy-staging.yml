# Deploy on merge to main. DEFERRED to Phase 6 by the owner, 2026-10-13 (T092): no staging during development.
# When it is built (002:T180, Q-3 (a)), a deploy runs `pnpm db:migrate` (the owner role) and then
# `pnpm db:seed` (the application role; it inserts only absent rows) before the API and the worker restart.
name: deploy-staging

# The token gets read access only (GitHub Actions hardening guide, OpenSSF Scorecard Token-Permissions).
# A stage that must write, such as a deploy, raises it on its own job, never here.
permissions:
  contents: read

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: echo "T092 - provision and deploy; must be live within fifteen minutes (SC-008)"
