<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<title>الانضمام ٢ — البيانات والشروط</title>

<link rel="stylesheet" href="ds/ijazah/tokens.css">

<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&amp;family=Inter:wght@400;500;700&amp;family=Amiri+Quran&amp;display=swap">
</helmet>
<div class="screen" dir="rtl" data-theme="light">
  <div class="status-bar" aria-hidden="true">
    <span>9:41</span>
    <span class="status-bar__icons">
      <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg>
      <svg width="15" height="11" viewBox="0 0 15 11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M1.5 4a9 9 0 0 1 12 0"/><path d="M3.8 6.4a5.6 5.6 0 0 1 7.4 0"/><circle cx="7.5" cy="9" r="0.9" fill="currentColor"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="3" stroke="currentColor" opacity=".45"/><rect x="2.5" y="2.5" width="16" height="7" rx="1.5" fill="currentColor"/><rect x="23" y="4" width="1.5" height="4" rx=".75" fill="currentColor" opacity=".45"/></svg>
    </span>
  </div>

  <main class="screen__body screen__body--bare">
    <ol class="steps" aria-label="الخطوة 2 من 2">
      <li class="steps__item steps__item--done"><span class="steps__bar"></span></li>
      <li class="steps__item steps__item--current" aria-current="step"><span class="steps__bar"></span></li>
    </ol>

    <div class="page-intro">
      <h1 class="page-intro__title">بياناتك</h1>
    </div>

    <form class="stack gap-5">
      <div class="field">
        <label for="nm" class="field__label">الاسم الظاهر</label>
        <input id="nm" class="input" value="يوسف أحمد">
      </div>

      <div class="field" role="radiogroup" aria-labelledby="g-label">
        <span id="g-label" class="field__label">الجنس</span>
        <div class="segmented">
          <label class="segmented__option segmented__option--selected"><input type="radio" name="g" class="check" checked>ذكر</label>
          <label class="segmented__option"><input type="radio" name="g" class="check">أنثى</label>
        </div>
        <span class="field__hint">لا يمكن تغييره لاحقًا.</span>
      </div>

      <div class="field">
        <label for="dob" class="field__label">تاريخ الميلاد</label>
        <input id="dob" class="input" value="12 مارس 2004">
      </div>

      <div class="card card--surface card--row">
        <span class="stack grow">
          <span class="text-callout text-medium">المنطقة الزمنية</span>
          <span class="text-caption tone-muted">القاهرة · من الجهاز</span>
        </span>
        <a href="TimeZonePicker.dc.html" class="btn btn--ghost btn--md">تغيير</a>
      </div>

      <label class="check-row check-row--top text-callout">
        <input type="checkbox" class="check" checked>
        <span>أوافق على <a href="Terms.dc.html" class="text-medium">الشروط والأحكام</a></span>
      </label>
    </form>

    <a href="ConfirmGender.dc.html" class="btn btn--primary btn--block push">متابعة</a>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

  renderVals() { return {}; }

</body>
</html>
