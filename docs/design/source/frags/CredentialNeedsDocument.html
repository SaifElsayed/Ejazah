<div class="screen" dir="rtl" data-theme="light">
{{SB}}

  <header class="nav-header">
    <div class="nav-header__bar">
      <a href="TeacherCredentials.dc.html" class="back-btn" aria-label="رجوع">{{icon:chevron-right:lg}}</a>
      <h1 class="nav-header__title">إجازة التجويد</h1>
    </div>
  </header>

  <main class="screen__body">
    <section class="card card--warning card--hero">
      <span class="badge badge--warning self-start">{{icon:file-text:xs}}مطلوب ملف آخر</span>
      <h2 class="text-title-3">طلب المشرف ملفًا آخر</h2>
      <blockquote class="card card--compact text-body">«الصفحة الأخيرة من الإجازة غير مقروءة، ولا يظهر فيها اسم المجيز. ارفع نسخة PDF كاملة وواضحة.»</blockquote>
      <span class="text-caption tone-warning">من فريق المراجعة</span>
    </section>

    <section class="section">
      <h2 class="section__title">الملف الحالي</h2>
      <div class="file">
        <span class="icon-tile icon-tile--danger">PDF</span>
        <span class="stack grow">
          <span class="text-callout text-medium">إجازة التجويد.pdf</span>
          <span class="text-micro tone-muted">1.8 م.ب</span>
        </span>
      </div>
    </section>

    <button type="button" class="btn btn--primary btn--block push">{{icon:upload:md}}رفع ملف آخر</button>
  </main>
</div>
