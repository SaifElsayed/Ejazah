<div class="screen" dir="rtl" data-theme="light">
{{SB}}

  <header class="nav-header">
    <div class="nav-header__bar">
      <a href="TeacherCredentials.dc.html" class="back-btn" aria-label="رجوع">{{icon:chevron-right:lg}}</a>
      <h1 class="nav-header__title">إضافة مادة</h1>
    </div>
  </header>

  <main class="screen__body">
    <div class="field">
      <span class="field__label" id="subj">المادة</span>
      <a href="SubjectPicker.dc.html" class="select" aria-labelledby="subj"><span>القراءات</span>{{icon:chevron-down:md}}</a>
    </div>

    <div class="field">
      <span class="field__label">إجازتك في هذه المادة</span>
      <div class="file">
        <span class="icon-tile icon-tile--danger">PDF</span>
        <span class="stack grow">
          <span class="text-callout text-medium">إجازة القراءات.pdf</span>
          <span class="text-micro tone-muted">3.4 م.ب</span>
        </span>
        <button type="button" class="icon-btn icon-btn--muted" aria-label="حذف الملف">{{icon:trash:md}}</button>
      </div>
      <span class="field__hint">PDF فقط.</span>
    </div>

    <p class="text-callout tone-muted">تصبح المادة متاحة لك بعد المراجعة.</p>

    <a href="TeacherCredentials.dc.html" class="btn btn--primary btn--block push">إرسال للمراجعة</a>
  </main>
</div>
