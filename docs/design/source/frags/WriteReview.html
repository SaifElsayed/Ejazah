<div class="screen" dir="rtl" data-theme="light">
{{SB}}

  <header class="nav-header">
    <div class="nav-header__bar">
      <a href="Main.dc.html" class="back-btn" aria-label="إغلاق">{{icon:x:lg}}</a>
      <h1 class="nav-header__title">قيّم اشتراكك</h1>
    </div>
  </header>

  <main class="screen__body gap-6">
    <section class="card card--surface card--row">
      <span class="avatar avatar--lg">أ</span>
      <span class="stack gap-half grow">
        <strong class="text-headline">الشيخ أحمد المصري</strong>
        <span class="text-caption tone-muted">حفظ القرآن · 8 من 8 جلسات · اكتمل 19 أغسطس</span>
      </span>
    </section>

    <fieldset class="stack items-center gap-2 text-center">
      <legend class="text-headline text-center">كيف كانت تجربتك؟</legend>
      <div class="row row--center gap-1" role="radiogroup" aria-label="التقييم من 1 إلى 5 نجوم">
        <button type="button" class="star-input star-input--on" role="radio" aria-checked="false" aria-label="نجمة واحدة">{{icon:star:xl}}</button>
        <button type="button" class="star-input star-input--on" role="radio" aria-checked="false" aria-label="نجمتان">{{icon:star:xl}}</button>
        <button type="button" class="star-input star-input--on" role="radio" aria-checked="false" aria-label="3 نجوم">{{icon:star:xl}}</button>
        <button type="button" class="star-input star-input--on" role="radio" aria-checked="true" aria-label="4 نجوم">{{icon:star:xl}}</button>
        <button type="button" class="star-input" role="radio" aria-checked="false" aria-label="5 نجوم">{{icon:star:xl}}</button>
      </div>
      <span class="text-body text-medium tone-muted">4 من 5 · جيدة جدًا</span>
    </fieldset>

    <div class="field">
      <label class="field__label" for="cm">تعليقك (اختياري)</label>
      <textarea id="cm" class="input" rows="5">صبور ودقيق في التصحيح، والتزم بالموعد في كل الجلسات.</textarea>
    </div>
  </main>

  <footer class="action-bar">
    <a href="TeacherProfile.dc.html" class="btn btn--primary btn--block">إرسال التقييم</a>
  </footer>
</div>
