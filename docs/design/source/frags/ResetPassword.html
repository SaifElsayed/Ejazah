<div class="screen" dir="rtl" data-theme="light">
{{SB}}

  <header class="nav-header">
    <div class="nav-header__bar">
      <a href="ForgotPassword.dc.html" class="back-btn" aria-label="رجوع">{{icon:chevron-right:lg}}</a>
    </div>
  </header>

  <main class="screen__body">
    <div class="page-intro">
      <h1 class="page-intro__title">كلمة مرور جديدة</h1>
      <p class="page-intro__lede">أرسلنا رمزًا إلى <span class="ltr tone-default">khaled.mansour@example.com</span></p>
    </div>

    <form class="stack gap-5">
      <div class="field">
        <label for="c1" class="field__label">رمز التحقق</label>
        <div class="otp">
          <input id="c1" type="text" inputmode="numeric" maxlength="1" value="2" class="otp__cell otp__cell--filled" aria-label="الرقم الأول">
          <input type="text" inputmode="numeric" maxlength="1" value="9" class="otp__cell otp__cell--filled" aria-label="الرقم الثاني">
          <input type="text" inputmode="numeric" maxlength="1" value="0" class="otp__cell otp__cell--filled" aria-label="الرقم الثالث">
          <input type="text" inputmode="numeric" maxlength="1" value="5" class="otp__cell otp__cell--filled" aria-label="الرقم الرابع">
          <input type="text" inputmode="numeric" maxlength="1" value="7" class="otp__cell otp__cell--filled" aria-label="الرقم الخامس">
          <input type="text" inputmode="numeric" maxlength="1" value="1" class="otp__cell otp__cell--filled" aria-label="الرقم السادس">
        </div>
        <span class="field__hint">إعادة الإرسال بعد 0:38</span>
      </div>

      <div class="field">
        <label for="np" class="field__label">كلمة المرور الجديدة</label>
        <input id="np" type="password" class="input input--ltr input--focused" value="••••••••••••">
      </div>

      <div class="field">
        <label for="np2" class="field__label">تأكيد كلمة المرور</label>
        <input id="np2" type="password" class="input input--ltr" value="••••••••••••">
      </div>
    </form>

    <a href="Main.dc.html" class="btn btn--primary btn--block push">حفظ كلمة المرور</a>
  </main>
</div>
