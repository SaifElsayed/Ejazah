<div class="screen" dir="rtl" data-theme="light">
{{SB}}

  <header class="nav-header">
    <div class="nav-header__bar">
      <a href="TeacherStudents.dc.html" class="back-btn" aria-label="رجوع">{{icon:chevron-right:lg}}</a>
      <h1 class="nav-header__title">طلب إجازة</h1>
    </div>
    <ol class="steps" aria-label="الخطوات">
      <li class="steps__item steps__item--current" aria-current="step"><span class="steps__bar"></span><span>البيانات</span></li>
      <li class="steps__item"><span class="steps__bar"></span><span>المعاينة</span></li>
    </ol>
  </header>

  <main class="screen__body">
    <div class="card card--surface card--compact card--row">
      <span class="avatar">ي</span>
      <span class="stack grow">
        <strong class="text-body text-bold">يوسف أحمد</strong>
        <span class="text-caption tone-muted">حفظ القرآن · 8 جلسات · اكتمل 19 أغسطس</span>
      </span>
      <span class="stack gap-1 items-end"><span class="badge badge--success">مكتمل</span><span class="badge badge--accent">مسار إجازة</span></span>
    </div>

    <section class="summary" aria-label="الإجازة">
      <div class="summary__row"><span class="summary__label">المادة</span><span class="summary__value">حفظ القرآن</span></div>
      <div class="summary__row"><span class="summary__label">الرواية</span><span class="summary__value">حفص عن عاصم · من طريق الشاطبية</span></div>
    </section>

    <div class="field">
      <label class="field__label" for="done">تاريخ الإتمام</label>
      <div class="input-group">
        <span class="tone-muted">{{icon:calendar:md}}</span>
        <input id="done" class="input-group__control" value="الأربعاء 19 أغسطس 2026">
      </div>
    </div>

    <div class="field">
      <span class="field__label" id="lang">لغة الشهادة</span>
      <div class="segmented" role="group" aria-labelledby="lang">
        <button type="button" class="segmented__option segmented__option--selected" aria-pressed="true">العربية</button>
        <button type="button" class="segmented__option" aria-pressed="false">English</button>
      </div>
    </div>

    <a href="IjazahRequestPreview.dc.html" class="btn btn--primary btn--block push">معاينة الشهادة</a>
  </main>
</div>
