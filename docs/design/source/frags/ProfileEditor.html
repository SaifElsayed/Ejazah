<div class="screen" dir="rtl" data-theme="light">
{{SB}}

  <header class="nav-header">
    <div class="nav-header__bar">
      <a href="TeacherAccount.dc.html" class="back-btn" aria-label="رجوع">{{icon:chevron-right:lg}}</a>
      <h1 class="nav-header__title">الملف العام</h1>
    </div>
  </header>

  <main class="screen__body gap-4">
    <div class="row gap-4">
      <span class="avatar avatar--xl">أ</span>
      <span class="stack gap-half grow">
        <button type="button" class="link self-start">{{icon:upload:sm}}تغيير الصورة</button>
      </span>
    </div>

    <div class="field">
      <label for="name" class="field__label">الاسم الظاهر</label>
      <input id="name" class="input" value="الشيخ أحمد المصري">
    </div>

    <div class="field">
      <label for="gender" class="field__label">الجنس</label>
      <input id="gender" class="input" value="ذكر" disabled>
      <span class="field__hint">للتغيير تواصل مع الدعم.</span>
    </div>

    <div class="field">
      <label for="bio" class="field__label">نبذة</label>
      <textarea id="bio" rows="2" class="input input--focused">أدرّس الحفظ والمراجعة للكبار منذ اثني عشر عامًا، بالتسميع المتدرّج وجهًا بوجه.</textarea>
    </div>

    <div class="field">
      <span class="field__label" id="subj">المواد</span>
      <div class="list" aria-labelledby="subj">
        <div class="list__row">
          <span class="grow">حفظ القرآن<span class="tone-muted"> · حفص عن عاصم</span></span>
          <a href="AddSubject.dc.html" class="btn btn--ghost btn--md">{{icon:plus:md}}إضافة مادة</a>
        </div>
      </div>
    </div>

    <div class="grid-2 gap-3">
      <div class="field">
        <label for="years" class="field__label">سنوات التدريس</label>
        <input id="years" class="input" value="12">
      </div>
      <div class="field">
        <label for="qual" class="field__label">نوع المؤهل</label>
        <input id="qual" class="input" value="إجازة بالسند المتصل">
      </div>
    </div>
  </main>

  <footer class="action-bar">
    <a href="TeacherAccount.dc.html" class="btn btn--primary btn--block">حفظ</a>
  </footer>
</div>
