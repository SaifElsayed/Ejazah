<div class="screen" dir="rtl" data-theme="light">
{{SB}}

  <header class="nav-header">
    <div class="nav-header__bar">
      <a href="TeacherAccount.dc.html" class="back-btn" aria-label="رجوع">{{icon:chevron-right:lg}}</a>
      <h1 class="nav-header__title">صورة التوقيع</h1>
    </div>
  </header>

  <main class="screen__body">
    <p class="text-body tone-muted">يظهر توقيعك على كل إجازة تصدر بطلبك.</p>

    <section class="section">
      <h2 class="section__title">المعاينة</h2>
      <div class="signature-pad" role="img" aria-label="لم تُرفع صورة توقيع بعد">لم تُرفع صورة بعد</div>
      <span class="field__hint">صورة واضحة لتوقيعك بالحبر على ورقة بيضاء، PNG أو JPG.</span>
    </section>

    <section class="section">
      <h2 class="section__title">أين يظهر</h2>
      <div class="row row--top gap-4">
        <figure class="certificate-page certificate-page--compact">
          <img class="certificate-page__image" src="/_blob/3446c9c9b29da8526f246f9d45725fd1" alt="صفحة الإجازة، وعليها توقيع المعلم أسفلها">
        </figure>
        <p class="text-callout tone-muted grow">أسفل الإجازة، بجانب الختم.</p>
      </div>
    </section>

    <button type="button" class="btn btn--primary btn--block push">{{icon:upload:md}}رفع التوقيع</button>
  </main>
</div>
