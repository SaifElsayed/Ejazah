<div class="screen" dir="rtl" data-theme="light">
{{SB}}

  <div class="screen__body behind-sheet" aria-hidden="true">
    <div class="pad-top"></div>
    <div class="row gap-3">
      <span class="avatar">ي</span>
      <span class="stack grow">
        <strong class="text-body text-bold">يوسف أحمد</strong>
        <span class="text-caption tone-muted">حفظ القرآن · 8 جلسات · 45 دقيقة</span>
      </span>
      <span class="stack gap-1 items-end"><span class="badge badge--success">جارٍ</span><span class="badge badge--neutral">تسميع</span></span>
    </div>
  </div>
  <div class="scrim"></div>

  <section class="sheet" role="dialog" aria-labelledby="sheet-title">
    <span class="sheet__handle"></span>
    <div class="sheet__header">
      <h1 id="sheet-title" class="sheet__title">موعد آخر للتعويض</h1>
      <a href="TeacherNotifications.dc.html" class="icon-btn icon-btn--muted" aria-label="إغلاق">{{icon:x:md}}</a>
    </div>

    <div class="card card--surface card--compact">
      <div class="row gap-3">
        <span class="avatar avatar--sm">ي</span>
        <span class="stack grow">
          <strong class="text-callout text-bold">يوسف أحمد</strong>
          <span class="text-caption tone-muted">الجلسة 10 · تعويض عن جلسة 11 نوفمبر</span>
        </span>
        <span class="badge badge--neutral">أُلغيت بالاتفاق</span>
      </div>
    </div>

    <section class="summary" aria-label="موعد التعويض">
      <div class="summary__row"><span class="summary__label">الموعد المقترح</span><span class="summary__value">الأربعاء 16 ديسمبر · 6:00 م</span></div>
      <div class="summary__row summary__row--emphasis"><span class="summary__label">اقتراح الطالب</span><span class="summary__value">الخميس 17 ديسمبر · 7:00 م</span></div>
    </section>
    <p class="text-caption tone-muted">بتوقيت القاهرة · 45 دقيقة</p>

    <div class="stack gap-2">
      <a href="TeacherEnrollment.dc.html" class="btn btn--primary btn--block">قبول</a>
      <a href="TeacherEnrollment.dc.html" class="btn btn--secondary btn--block">رفض (يبقى الموعد المقترح)</a>
    </div>
  </section>
</div>
