<div class="screen" dir="rtl" data-theme="light">
{{SB}}

  <main class="screen__body screen__body--bare">
    <div class="stack gap-3 items-center text-center">
      <span class="icon-tile icon-tile--2xl icon-tile--neutral" aria-hidden="true">{{icon:alert-circle:xl}}</span>
      <div class="stack gap-1">
        <h1 class="text-title-2">لم يكتمل الدفع</h1>
        <p class="text-body tone-muted">يمكنك المحاولة مرة أخرى.</p>
      </div>
    </div>

    <section class="summary" aria-label="الطلب">
      <div class="summary__row"><span class="summary__label">الباقة</span><span class="summary__value">حفظ القرآن · 8 جلسات · الشيخ أحمد المصري</span></div>
      <div class="summary__row"><span class="summary__label">الموعد</span><span class="summary__value">السبت 10:00 ص</span></div>
      <div class="summary__row"><span class="summary__label">أكمل الدفع خلال</span><span class="summary__value ltr">6:30</span></div>
    </section>

    <div class="stack gap-3 push">
      <a href="Checkout.dc.html" class="btn btn--primary btn--block">إعادة المحاولة</a>
      <a href="BookingSheet.dc.html" class="btn btn--secondary btn--block">اختر موعدًا آخر</a>
    </div>
  </main>
</div>
