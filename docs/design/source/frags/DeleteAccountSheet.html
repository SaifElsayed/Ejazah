<div class="screen" dir="rtl" data-theme="light">
{{SB}}

  <div class="screen__body behind-sheet" aria-hidden="true">
    <div class="pad-top"></div>
    <strong class="text-title-3">حذف الحساب</strong>
    <div class="banner banner--warning">
      {{icon:triangle-alert:md}}
      <span class="grow">لديك اشتراكان جاريان مع الشيخ أحمد المصري.</span>
    </div>
    <strong class="section__title">ما يُحذف</strong>
    <span class="text-callout tone-muted">اسمك وبريدك وتاريخ ميلادك وصورتك</span>

    <div class="stack gap-2">
      <a href="Welcome.dc.html" class="btn btn--danger btn--block">تأكيد بجوجل وحذف الحساب</a>
      <a href="DeleteAccount.dc.html" class="btn btn--ghost btn--block">إلغاء</a>
