<div class="screen" dir="rtl" data-theme="light">
{{SB}}

  <header class="app-header">
    <span class="brand"><span class="brand-mark" aria-hidden="true">إ</span><span class="brand__name">إجازة</span></span>
    <div class="app-header__actions">
      <a href="Notifications.dc.html" class="icon-btn icon-btn--surface" aria-label="الإشعارات">{{icon:bell:lg}}<span class="icon-btn__dot"></span></a>
      <a href="StudentAccount.dc.html" class="avatar avatar--touch" aria-label="حسابي">ي</a>
    </div>
  </header>

  <main class="screen__body">
    <div class="stack">
      <span class="text-body tone-muted">أهلًا بك</span>
      <span class="text-title-1">يوسف</span>
    </div>

    <section class="card card--surface card--hero">
      <span class="text-callout tone-muted">خطوتك الأولى</span>
      <h2 class="text-title-2">اختر معلمًا وباقة تناسبك</h2>
      <ol class="stack gap-2 text-body">
        <li class="row gap-3"><span class="timeline__marker timeline__marker--done">1</span>ابحث بالمادة واطّلع على سند المعلم</li>
        <li class="row gap-3"><span class="timeline__marker timeline__marker--pending">2</span>اختر موعدًا أسبوعيًا ثابتًا</li>
        <li class="row gap-3"><span class="timeline__marker timeline__marker--pending">3</span>ادفع، وتُحجز جلساتك كلها</li>
      </ol>
      <a href="Discovery.dc.html" class="btn btn--primary btn--block">ابحث عن معلم</a>
    </section>


    <section class="section">
      <h2 class="section__title">تصفّح بالمادة</h2>
      <div class="row wrap gap-2">
        <a href="Discovery.dc.html" class="chip">حفظ القرآن</a>
        <a href="Discovery.dc.html" class="chip">التجويد</a>
        <a href="Discovery.dc.html" class="chip">القراءات</a>
      </div>
    </section>
  </main>

  {{TABS:student:Main}}
</div>
